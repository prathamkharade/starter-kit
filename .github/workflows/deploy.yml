# Builds images on GitHub (not on your laptop or the small server), pushes to
# GHCR, then deploys over SSH. Trigger: push a tag like v1.2.3, or run manually.
# Repo secrets: SSH_HOST, SSH_USER, SSH_KEY (private key of the deploy user).
name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile, target: api }
          - { name: worker, context: backend, file: backend/Dockerfile, target: worker }
          - { name: web, context: ., file: infra/web.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # amd64 only by default; add linux/arm64 for ARM VPSes (Hetzner CAX, Oracle Ampere)
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app && git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            TAG=${{ github.sha }} infra/scripts/deploy.sh
