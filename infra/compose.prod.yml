# Production: one small VPS runs everything. ~400–600 MB RAM total at idle.
#   caddy  : HTTPS (auto Let's Encrypt), HTTP/3, brotli/gzip, serves Flutter web, proxies /v1 → api
#   api    : Go API (distroless, read-only FS, non-root)
#   worker : jobs (email/SMS/media compression/retention)
#   db     : Postgres 18 (not exposed to the internet)
# Deploy: scripts/deploy.sh (pulls images built by GitHub Actions, then `up -d`).
# Secrets live in infra/.env.prod on the server (chmod 600), never in git.
name: app

x-app: &app
  env_file: .env.prod
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    db: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: ${REGISTRY:-ghcr.io/your-org/app}/web:${TAG:-latest}
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/.env.prod}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  api:
    <<: *app
    image: ${REGISTRY:-ghcr.io/your-org/app}/api:${TAG:-latest}
    command: ["serve"]
    environment:
      WORKER_EMBEDDED: "false"
      TRUST_PROXY: "true"
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8"
    mem_limit: 256m # distroless has no shell for a healthcheck; Caddy probes /readyz instead

  worker:
    <<: *app
    image: ${REGISTRY:-ghcr.io/your-org/app}/worker:${TAG:-latest}
    command: ["worker"]
    tmpfs: [] # scratch on disk, not RAM: large videos must not count against mem_limit
    volumes: [worker_tmp:/tmp]
    mem_limit: 768m
    cpus: 1.0 # keep video encoding from starving the API

  db:
    image: postgres:18-alpine
    env_file: .env.prod
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    # Tuned for a 2–4 GB VPS. Raise shared_buffers to ~25% of RAM on bigger boxes.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
               -c maintenance_work_mem=64MB -c max_connections=60 -c wal_compression=on
               -c log_min_duration_statement=500 -c idle_in_transaction_session_timeout=60000
    volumes: [pgdata:/var/lib/postgresql, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    logging: *logging

volumes:
  pgdata:
  worker_tmp:
  caddy_data:
  caddy_config:
