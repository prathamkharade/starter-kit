<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="App">
  <meta name="theme-color" content="#3B5BDB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Start fetching the engine while the bootstrap script parses -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <style>
    /* Instant first paint: pure CSS splash, no external fonts/requests (fast + GDPR-clean). */
    html, body { margin: 0; height: 100%; background: #fff; }
    @media (prefers-color-scheme: dark) { html, body { background: #121318; } }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #3B5BDB; transition: opacity .2s; }
    #splash .dot { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #3B5BDB33; border-top-color: #3B5BDB; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .dot { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading"><div class="dot"></div></div>
  <noscript>This app needs JavaScript enabled.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
